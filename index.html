<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-commerce Product Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container">

    <header class="header">

      <div class="header-left">

        <a href="#" class="logo">sneakers</a>

        <nav class="nav">
          <a href="#">Collections</a>
          <a href="#">Men</a>
          <a href="#">Women</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>

      </div>

      <div class="header-right">

        <button class="cart-btn">
          🛒
          <span class="cart-count">3</span>
        </button>

        <img src="https://i.pravatar.cc/100" alt="avatar" class="avatar" />

      </div>

    </header>

    <main class="product-section">

      <div class="gallery">

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200" alt="Sneakers"
          class="main-image" />

        <div class="thumbnails">

          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=400" alt="" class="thumb active" />

          <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=400" alt="" class="thumb" />

          <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?q=80&w=400" alt="" class="thumb" />

          <img src="https://images.unsplash.com/photo-1605348532760-6753d2c43329?q=80&w=400" alt="" class="thumb" />

        </div>

      </div>

      <div class="product-info">

        <span class="company">
          Sneaker Company
        </span>

        <h1>
          Fall Limited Edition Sneakers
        </h1>

        <p class="description">
          These low-profile sneakers are your perfect casual wear companion.
          Featuring a durable rubber outer sole, they’ll withstand everything
          the weather can offer.
        </p>

        <div class="price-box">
          <div class="price-row">
            <span class="current-price">
              $125.00
            </span>

            <span class="discount">
              50%
            </span>

          </div>

          <span class="old-price">
            $250.00
          </span>

        </div>

        <div class="actions">

          <div class="quantity-box">

            <button>-</button>

            <span>0</span>

            <button>+</button>

          </div>

          <button class="add-btn">
            Add to cart
          </button>

        </div>

      </div>

    </main>

  </div>

</body>

</html>
